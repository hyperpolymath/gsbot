<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: CC-BY-SA-4.0 -->
<!-- GSBot social preview — 1280×640, GitHub recommended -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="0.6" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- G-Spot-ish decorative circle (the double entendre, rendered tastefully as a system node) -->
  <circle cx="1030" cy="200" r="150" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.45"/>
  <circle cx="1030" cy="200" r="80" fill="none" stroke="#3fb950" stroke-width="3" opacity="0.5"/>
  <circle cx="1030" cy="200" r="20" fill="#3fb950" opacity="0.8"/>
  <!-- connecting nodes -->
  <g stroke="#58a6ff" stroke-width="2" opacity="0.6" fill="none">
    <line x1="1030" y1="200" x2="880" y2="350"/>
    <line x1="1030" y1="200" x2="1130" y2="380"/>
    <line x1="1030" y1="200" x2="980" y2="420"/>
  </g>
  <g fill="#58a6ff" opacity="0.8">
    <circle cx="880" cy="350" r="10"/>
    <circle cx="1130" cy="380" r="10"/>
    <circle cx="980" cy="420" r="10"/>
  </g>

  <!-- Title block -->
  <text x="80" y="170" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" opacity="0.85">
    hyperpolymath / gsbot
  </text>
  <text x="80" y="260" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="88" font-weight="700">
    GSBot
  </text>
  <text x="80" y="320" fill="#3fb950" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="500">
    Garment Sustainability Bot
  </text>

  <!-- Tagline -->
  <text x="80" y="400" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="26">
    Materials science, math &amp; engineering for fashion &amp; textiles.
  </text>
  <text x="80" y="440" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="26">
    Pareto-optimal triple-bottom-line analysis over open standards.
  </text>

  <!-- Tech chips -->
  <g font-family="ui-monospace, monospace" font-size="20" fill="#0d1117">
    <rect x="80"  y="500" rx="12" ry="12" width="155" height="40" fill="#3fb950" opacity="0.9"/>
    <text x="157" y="527" text-anchor="middle">Rust / SPARK</text>
    <rect x="250" y="500" rx="12" ry="12" width="130" height="40" fill="#ffa657" opacity="0.9"/>
    <text x="315" y="527" text-anchor="middle">Eclexia</text>
    <rect x="395" y="500" rx="12" ry="12" width="155" height="40" fill="#79c0ff" opacity="0.9"/>
    <text x="472" y="527" text-anchor="middle">verisimdb</text>
    <rect x="565" y="500" rx="12" ry="12" width="100" height="40" fill="#d2a8ff" opacity="0.9"/>
    <text x="615" y="527" text-anchor="middle">kyaml</text>
    <rect x="680" y="500" rx="12" ry="12" width="170" height="40" fill="#ff7b72" opacity="0.9"/>
    <text x="765" y="527" text-anchor="middle">Pareto · Kautz-6</text>
    <rect x="865" y="500" rx="12" ry="12" width="185" height="40" fill="#7ee787" opacity="0.9"/>
    <text x="958" y="527" text-anchor="middle">RSS · ActivityStreams</text>
  </g>

  <!-- URL -->
  <text x="80" y="600" fill="#8b949e" font-family="ui-monospace, monospace" font-size="22">
    github.com/hyperpolymath/gsbot  ·  MPL-2.0
  </text>
</svg>
