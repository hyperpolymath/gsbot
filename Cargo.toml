# SPDX-License-Identifier: MPL-2.0
[package]
name = "gsbot"
version = "0.3.0"
edition = "2021"
rust-version = "1.77"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = """
GSBot — the Garment Sustainability Bot: a neurosymbolic (Kautz-6) chat + dashboard
for fashion and textiles specialists.  Materials science, math and engineering
meet triple-bottom-line ethics (permaculture fairness, environmental stewardship,
economics, aesthetics, axiology).  Scores garments/materials/brands for ecological
impact, water/carbon/energy/chemical load, biodegradability, durability, labour
and animal welfare; supports Pareto-optimal trade-off analysis, ontology-driven
RSS/ActivityStreams feeds, open-standards catalogue/safety-notice integration via
a Zig-API adapter seam, a verisimdb/kyaml/Eclexia core target, and a detachable-
panel assembly planner for ecological-vs-economic cost swaps.
"""
homepage = "https://github.com/hyperpolymath/gsbot"
repository = "https://github.com/hyperpolymath/gsbot"
readme = "README.adoc"
keywords = [
    "sustainability", "fashion", "textiles", "garment", "materials-science",
    "discord", "chatbot", "neurosymbolic", "triple-bottom-line", "lca",
    "circular-economy", "pareto-optimality", "supply-chain", "permaculture",
    "ecological-footprint", "open-standards", "spark", "verification",
    "zig-ffi", "idris2-abi", "dragonfly", "lmdb",
    "eclexia", "verisimdb",
]
categories = [
    "command-line-utilities",
    "science",
    "simulation",
    "database",
    "web-programming",
]

[[bin]]
name = "gsbot"
path = "src/main.rs"

[[bin]]
name = "gsbot-load-fixtures"
path = "src/bin/load_fixtures.rs"

[[bin]]
name = "gsbot-export-data"
path = "src/bin/export_data.rs"

[[bin]]
name = "gsbot-backup-db"
path = "src/bin/backup_db.rs"

[lib]
name = "gsbot"
path = "src/lib.rs"

[dependencies]
# Discord (prefix-command framework over serenity — faithful map of discord.py cogs)
poise = "0.6.2"
serenity = { version = "0.12.5", default-features = false, features = [
  "client", "gateway", "rustls_backend", "model", "cache",
] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }

# Persistence (SQLAlchemy/Alembic analogue)
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio-rustls", "sqlite", "macros", "chrono", "migrate",
] }

# Config / env (.env -> python-dotenv analogue)
dotenvy = "0.15.7"

# Logging (colorlog analogue)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "ansi"] }
tracing-appender = "0.2.5"

# Utilities
anyhow = "1.0.102"
thiserror = "2.0.18"
chrono = { version = "0.4.44", features = ["clock"] }
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
